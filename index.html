<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* WAP Mini App · Gói 5 · phiên bản 1.2 (tên hiển thị "Mini App"; nút báo cáo đóng app) · phong cách tối giản kiểu iOS */
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #000000; --sub: #8e8e93; --head: #6d6d72;
    --sep: #c6c6c8; --blue: #007aff; --red: #ff3b30; --orange: #ff9500; --green: #34c759; --purple: #af52de;
    --fill: #e3e3e8; --segon: #ffffff; --tab: rgba(249,249,249,.94); --chev: #c4c4c7; --skel: #e5e5ea;
  }
  html[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --text: #ffffff; --sub: #8e8e93; --head: #8e8e93;
    --sep: #38383a; --blue: #0a84ff; --red: #ff453a; --orange: #ff9f0a; --green: #30d158; --purple: #bf5af2;
    --fill: #2c2c2e; --segon: #636366; --tab: rgba(22,22,22,.94); --chev: #48484a; --skel: #2c2c2e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 17px; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; color: inherit; }
  #app { padding-bottom: 110px; min-height: 100vh; }
  .nav { display: flex; justify-content: flex-end; padding: 10px 20px 0; min-height: 40px; }
  .nav button { border: none; background: none; color: var(--blue); font-size: 17px; padding: 6px 0; }
  .lt { padding: 2px 20px 2px; font-size: 34px; font-weight: 700; letter-spacing: -.6px; line-height: 1.15; }
  .lt.md { font-size: 26px; letter-spacing: -.4px; }
  .subt { padding: 2px 20px 14px; font-size: 15px; color: var(--sub); }
  .seg { margin: 0 16px 18px; background: var(--fill); border-radius: 9px; padding: 2px; display: grid; gap: 2px; }
  .seg button { border: none; background: none; border-radius: 7px; padding: 7px 2px; font-size: 13px; font-weight: 500; }
  .seg button.on { background: var(--segon); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .hd { padding: 0 32px 6px; font-size: 13px; color: var(--head); text-transform: uppercase; letter-spacing: .2px; }
  .grp { margin: 0 16px 22px; background: var(--card); border-radius: 12px; overflow: hidden; }
  .cell { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; min-height: 44px; width: 100%; border: none; background: none; text-align: left; font-size: 17px; }
  .cell + .cell::before, .cell + .lnk::before, .lnk + .cell::before, .blk + .cell::before, .cell + .blk::before, .blk + .blk::before, .lnk + .blk::before, .blk + .lnk::before, .acts::before { content: ""; position: absolute; left: 16px; right: 0; top: 0; height: .5px; background: var(--sep); }
  .cell:active, .lnk:active { background: var(--fill); }
  .txt { flex: 1; min-width: 0; }
  .t { letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { font-size: 14px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s.wrap { white-space: normal; }
  .r { font-size: 15px; color: var(--sub); white-space: nowrap; }
  .chev { color: var(--chev); font-size: 22px; line-height: 1; margin-left: -4px; }
  .red { color: var(--red) !important; } .orange { color: var(--orange) !important; } .green { color: var(--green) !important; } .blue { color: var(--blue) !important; } .purple { color: var(--purple) !important; }
  .lnk { display: block; width: 100%; border: none; background: none; text-align: left; color: var(--blue); font-size: 17px; padding: 12px 16px; position: relative; }
  .blk { padding: 12px 16px; position: relative; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .blk b { font-weight: 600; }
  .kv { display: flex; justify-content: space-between; gap: 16px; }
  .kv span:last-child { color: var(--sub); text-align: right; }
  .ft { padding: 0 32px 22px; font-size: 13px; color: var(--sub); line-height: 1.4; }
  .grid { margin: 0 16px 22px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .st { background: var(--card); border-radius: 12px; padding: 12px 14px; border: none; text-align: left; }
  .st b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
  .st span { font-size: 13px; color: var(--sub); }
  .acts { display: flex; gap: 8px; padding: 10px 12px 12px; position: relative; }
  .btn { flex: 1; border: none; border-radius: 10px; padding: 11px 6px; font-size: 15px; font-weight: 600; min-height: 44px; white-space: nowrap; }
  .acts .btn { font-size: 14px; }
  .btn.pri { background: var(--blue); color: #fff; }
  .btn.ok { background: var(--green); color: #fff; }
  .btn.no { background: var(--fill); color: var(--red); }
  .btn.plain { background: var(--fill); color: var(--text); }
  .btn:disabled { opacity: .5; }
  .wide { margin: 0 16px 22px; display: block; width: calc(100% - 32px); }
  .bars { display: flex; gap: 3px; margin-top: 7px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); }
  .bars i.d { background: var(--green); } .bars i.c { background: var(--blue); } .bars i.l { background: var(--orange); }
  .dot { width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid var(--chev); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
  .dot.d { background: var(--green); border-color: var(--green); }
  .dot.c { border-color: var(--blue); border-width: 2px; }
  .empty { text-align: center; color: var(--sub); padding: 60px 30px; font-size: 15px; line-height: 1.5; }
  .empty b { display: block; color: var(--text); font-size: 20px; margin-bottom: 6px; }
  .sk { height: 14px; border-radius: 7px; background: var(--skel); animation: p 1.2s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--tab); border-top: .5px solid var(--sep); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); z-index: 10; }
  .tb { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: #999; position: relative; padding: 2px 0; }
  .tb.on { color: var(--blue); }
  .badge { position: absolute; top: -3px; left: 54%; background: var(--red); color: #fff; font-size: 11px; font-weight: 600; border-radius: 9px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; padding: 0 5px; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 0 calc(16px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 10px; }
  .sh { padding: 0 20px 12px; font-size: 20px; font-weight: 600; }
  .inp { width: 100%; border: none; background: var(--card); color: var(--text); font: inherit; font-size: 17px; padding: 12px 16px; outline: none; }
  .chips { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 0 16px 18px; }
  .chip { border: none; background: var(--card); border-radius: 10px; padding: 10px 4px; font-size: 14px; font-weight: 500; min-height: 44px; }
  .chip.on { background: var(--blue); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: 86%; text-align: center; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<div id="tabs"></div>
<div id="layer"></div>
<div id="toast" class="toast"></div>
<script>
/* ====================================================
   CẤU HÌNH: dán link /exec của Web App vào đây
   ==================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbx6wJS2VsNbBGhPvT5uVUADtdF55hl8CcU9-2ZCMtkfoOafWs6Le-uES2hg9BWxvT03/exec";

const tg = window.Telegram && window.Telegram.WebApp;
const S = { me: null, tab: "mine", cache: {}, stack: [], seg: {}, busy: false };

/* ---------- Tiện ích ---------- */
function esc(v) { return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function $(id) { return document.getElementById(id); }
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
function tap() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600); }
function openLink(url, closeAfter) {
  if (!url) return;
  try { if (/^https:\/\/t\.me\//.test(url)) tg.openTelegramLink(url); else tg.openLink(url); } catch (e) { window.open(url, "_blank"); }
  // 1.2: nút "Mở tin giao việc để báo cáo" đóng Mini App sau khi chuyển sang tin trong nhóm
  if (closeAfter) setTimeout(() => { try { tg.close(); } catch (e) {} }, 300);
}
function applyTheme() { document.documentElement.dataset.theme = (tg && tg.colorScheme === "dark") ? "dark" : "light"; try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {} }

async function api(action, params) {
  const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: action, initData: tg ? tg.initData : "", params: params || {} }) });
  const json = await res.json();
  if (!json.ok && ["AUTH", "NO_USER", "EXPIRED"].indexOf(json.error) >= 0) { fatal(json.error === "NO_USER" ? "Chưa có quyền" : "Không mở được", json.message); throw new Error("stop"); }
  return json;
}

function fatal(title, msg) { $("tabs").innerHTML = ""; $("app").innerHTML = '<div class="empty" style="padding-top:120px"><b>' + esc(title) + '</b>' + esc(msg) + '</div>'; }

function skeleton(title) {
  let rows = "";
  for (let i = 0; i < 5; i++) rows += '<div class="cell"><div class="txt"><div class="sk" style="width:' + (55 + i * 7) + '%"></div><div class="sk" style="width:35%;margin-top:8px;height:11px"></div></div></div>';
  return navBar() + '<div class="lt">' + esc(title) + '</div><div class="subt">Đang tải…</div><div class="grp">' + rows + '</div>';
}
function navBar(extra) { return '<div class="nav">' + (extra || '<button onclick="reload()">Tải lại</button>') + '</div>'; }
function chev() { return '<span class="chev">›</span>'; }
function row(o) {
  const tag = o.onclick ? 'button class="cell" onclick="' + o.onclick + '"' : 'div class="cell"';
  const end = o.onclick ? "button" : "div";
  return '<' + tag + '><div class="txt"><div class="t">' + esc(o.title) + '</div>' + (o.sub ? '<div class="s' + (o.wrap ? ' wrap' : '') + '">' + esc(o.sub) + '</div>' : '') + (o.extra || '') + '</div>' + (o.right ? '<span class="r ' + (o.tone || '') + '">' + esc(o.right) + '</span>' : '') + (o.onclick ? chev() : '') + '</' + end + '>';
}
function seg(key, items) {
  const cur = S.seg[key];
  return '<div class="seg" style="grid-template-columns:repeat(' + items.length + ',minmax(0,1fr))">' + items.map(it => '<button class="' + (it.k === cur ? 'on' : '') + '" onclick="setSeg(\'' + key + '\',\'' + it.k + '\')">' + esc(it.label) + '</button>').join("") + '</div>';
}
function setSeg(key, val) { tap(); S.seg[key] = val; render(); }

/* ---------- Thanh tab (Admin) ---------- */
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  approvals: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  projects: '<path d="M4 6h16M4 12h10M4 18h6"/>',
  compliance: '<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/>',
  mine: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'
};
const TABS = [["home", "Tổng quan"], ["approvals", "Chờ duyệt"], ["projects", "Dự án"], ["compliance", "Nhắc nhở"], ["mine", "Của tôi"]];
function renderTabs() {
  if (!S.me || !S.me.isAdmin) { $("tabs").innerHTML = ""; return; }
  const pending = S.cache.home ? S.cache.home.stats.pending : 0;
  $("tabs").innerHTML = '<nav class="tabbar">' + TABS.map(t =>
    '<button class="tb ' + (S.tab === t[0] ? 'on' : '') + '" onclick="goTab(\'' + t[0] + '\')">' +
    (t[0] === "approvals" && pending ? '<span class="badge">' + pending + '</span>' : '') +
    '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[t[0]] + '</svg>' + t[1] + '</button>').join("") + '</nav>';
}

/* ---------- Điều hướng ---------- */
const LOADERS = { home: "home", approvals: "approvals", projects: "projects", compliance: "compliance", mine: "myTasks" };
function goTab(tab) { tap(); S.tab = tab; S.stack = []; updateBack(); render(); load(tab); window.scrollTo(0, 0); }
async function load(tab) {
  try {
    const res = await api(LOADERS[tab]);
    if (!res.ok) { toast(res.message || "Lỗi tải dữ liệu"); return; }
    S.cache[tab] = res.data;
    if (S.tab === tab && !S.stack.length) render();
    if (tab === "home") renderTabs();
  } catch (e) { if (e.message !== "stop") toast("Không kết nối được máy chủ"); }
}
function reload() { tap(); if (S.stack.length) { openDetail(S.stack[S.stack.length - 1], true); } else { load(S.tab); toast("Đang tải lại…"); } }
function push(view) { S.stack.push(view); updateBack(); openDetail(view); window.scrollTo(0, 0); }
function back() { S.stack.pop(); updateBack(); render(); }
function updateBack() { try { S.stack.length ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }

async function openDetail(view, refresh) {
  if (!refresh) $("app").innerHTML = skeleton(view.title || "Chi tiết");
  const action = view.type === "task" ? "taskDetail" : "projectDetail";
  try {
    const res = await api(action, { taskId: view.id });
    if (!res.ok) { toast(res.message || "Lỗi"); back(); return; }
    view.data = res.data;
    if (S.stack[S.stack.length - 1] === view) render();
  } catch (e) { if (e.message !== "stop") toast("Không kết nối được máy chủ"); }
}

function render() {
  renderTabs();
  const top = S.stack[S.stack.length - 1];
  if (top) { if (top.data) $("app").innerHTML = top.type === "task" ? viewTask(top.data) : viewProject(top.data); return; }
  const d = S.cache[S.tab];
  const titles = { home: "Tổng quan", approvals: "Chờ duyệt", projects: "Dự án", compliance: "Nhắc nhở", mine: "Việc của tôi" };
  if (!d) { $("app").innerHTML = skeleton(titles[S.tab]); return; }
  const fn = { home: viewHome, approvals: viewApprovals, projects: viewProjects, compliance: viewCompliance, mine: viewMine }[S.tab];
  $("app").innerHTML = fn(d);
}

/* ---------- Việc của tôi ---------- */
function viewMine(d) {
  const c = d.counts;
  if (!S.seg.mine) S.seg.mine = c.overdue ? "overdue" : c.today ? "today" : c.upcoming ? "upcoming" : c.pending ? "pending" : "overdue";
  const parts = [];
  if (c.overdue) parts.push(c.overdue + " quá hạn");
  if (c.today) parts.push(c.today + " hôm nay");
  parts.push("cập nhật " + d.updated);
  const labels = { overdue: "Quá hạn", today: "Hôm nay", upcoming: "Sắp tới", pending: "Chờ duyệt" };
  const k = S.seg.mine;
  const list = d[k];
  let body = "";
  if (!list.length) {
    body = '<div class="empty">' + (k === "overdue" ? "Không có việc quá hạn 👍" : "Không có việc nào") + '</div>';
  } else {
    body = '<div class="hd">' + labels[k] + '</div><div class="grp">' + list.map(it =>
      row({ title: it.title, sub: it.sub, extra: it.checkin ? '<div class="s orange">Chờ bạn trả lời báo cáo tiến độ</div>' : '', right: it.right, tone: it.tone, onclick: "push({type:'task',id:'" + it.id + "',title:'Chi tiết việc'})" }) +
      ((k === "overdue" || k === "today") && it.link ? '<button class="lnk" onclick="openLink(\'' + esc(it.link) + '\', true)">Mở tin giao việc để báo cáo</button>' : '')
    ).join("") + '</div>';
  }
  return navBar() + '<div class="lt">' + (S.me.isAdmin ? "Của tôi" : "Việc của tôi") + '</div><div class="subt">' + esc(parts.join(" · ")) + '</div>' +
    seg("mine", Object.keys(labels).map(x => ({ k: x, label: labels[x] + (c[x] ? " " + c[x] : "") }))) + body +
    '<div class="ft">Báo cáo hoàn thành bằng cách Reply tin giao việc trong nhóm. Chạm vào việc để xem chi tiết.</div>';
}

/* ---------- Chi tiết việc ---------- */
function viewTask(t) {
  const kv = (k, v, tone) => v ? '<div class="blk kv"><span>' + esc(k) + '</span><span class="' + (tone || '') + '">' + esc(v) + '</span></div>' : '';
  let h = navBar() + '<div class="lt md">' + esc(t.title) + '</div><div class="subt">' + esc(t.id) + ' · ' + esc(t.createdVia) + '</div>';
  h += '<div class="grp">' + kv("Trạng thái", t.status, t.overdue ? "red" : "") + kv("Hạn hiện tại", t.deadline) + kv("Hạn gốc", t.original) + kv("Người nhận", S.me.isAdmin ? t.assignee : "") + kv("Nhóm", t.group) + kv("Giao lúc", t.createdAt) + kv("Bị từ chối", t.rejectCount ? t.rejectCount + " lần" : "") + (t.multiStep ? kv("Hạn hoàn tất dự án", t.projectDeadline) : "") + '</div>';
  if (t.description) h += '<div class="hd">Yêu cầu</div><div class="grp"><div class="blk">' + esc(t.description) + '</div></div>';
  if (t.reported) h += '<div class="hd">Báo cáo lúc ' + esc(t.reportAt) + '</div><div class="grp"><div class="blk">' + esc(t.reportMessage || "(không có chữ)") + '</div></div>';
  if (t.extension) h += '<div class="hd">Gia hạn</div><div class="grp"><div class="blk">' + esc(t.extension) + '</div></div>';
  if (t.log.length) h += '<div class="hd">Nhật ký tiến độ</div><div class="grp">' + t.log.map(l => '<div class="blk"><b>' + esc(l.head) + '</b>\n' + esc(l.body) + '</div>').join("") + '</div>';
  if (t.link && !t.completed) h += '<button class="btn pri wide" onclick="openLink(\'' + esc(t.link) + '\', true)">Mở tin giao việc để báo cáo</button><div class="ft">Mini App sẽ đóng và mở đúng tin trong nhóm. Reply tin đó (kèm ảnh nếu cần) để báo cáo hoàn thành.</div>';
  else if (t.link) h += '<button class="btn plain wide" onclick="openLink(\'' + esc(t.link) + '\')">Xem tin giao việc</button>';
  return h;
}

/* ---------- Admin: Tổng quan ---------- */
function viewHome(d) {
  const s = d.stats;
  let h = navBar() + '<div class="lt">Tổng quan</div><div class="subt">' + esc(S.me.today) + ' · cập nhật ' + esc(d.updated) + '</div>';
  h += '<div class="grid">' +
    '<div class="st"><b class="red">' + s.overdue + '</b><span>Quá hạn</span></div>' +
    '<button class="st" onclick="goTab(\'approvals\')"><b class="blue">' + s.pending + '</b><span>Chờ duyệt</span></button>' +
    '<div class="st"><b class="orange">' + s.dueToday + '</b><span>Đến hạn hôm nay</span></div>' +
    '<div class="st"><b class="green">' + s.completedToday + '</b><span>Hoàn thành hôm nay</span></div></div>';
  h += '<div class="hd">Cần xử lý</div><div class="grp">' + (d.issues.length ? d.issues.map(i => row({ title: i.title, sub: i.sub, right: i.right, onclick: i.go ? "goTab('" + i.go + "')" : "" })).join("") : '<div class="cell"><div class="txt"><div class="t green">Không có vấn đề</div></div></div>') + '</div>';
  if (d.overdue.length) h += '<div class="hd">Quá hạn lâu nhất</div><div class="grp">' + d.overdue.map(o => row({ title: o.title, sub: o.sub, right: o.right, tone: "red", onclick: "push({type:'task',id:'" + o.id + "',title:'Chi tiết việc'})" })).join("") + '</div>';
  return h;
}

/* ---------- Admin: Chờ duyệt ---------- */
function viewApprovals(list) {
  let h = navBar() + '<div class="lt">Chờ duyệt</div><div class="subt">' + list.length + ' báo cáo · cũ nhất lên trước</div>';
  if (!list.length) return h + '<div class="empty"><b>Đã xử lý hết</b>Không còn báo cáo nào chờ duyệt.</div>';
  return h + list.map(a => {
    const badge = a.onTime ? '<span class="r green">Đúng hạn</span>' : (a.lateText ? '<span class="r red">' + esc(a.lateText) + '</span>' : '');
    const links = [];
    if (a.taskLink) links.push('<button class="lnk" style="display:inline;width:auto;padding:0" onclick="openLink(\'' + esc(a.taskLink) + '\')">Tin giao việc</button>');
    if (a.reportLink) links.push('<button class="lnk" style="display:inline;width:auto;padding:0" onclick="openLink(\'' + esc(a.reportLink) + '\')">Tin báo cáo (xem ảnh)</button>');
    return '<div class="grp" id="ap-' + esc(a.id) + '">' +
      '<button class="cell" onclick="push({type:\'task\',id:\'' + a.id + '\',title:\'Chi tiết việc\'})"><div class="txt"><div class="t">' + esc(a.title) + '</div><div class="s">' + esc(a.name + (a.group ? " · " + a.group : "") + " · " + a.reportAt) + '</div></div>' + badge + chev() + '</button>' +
      '<div class="blk">' + esc(a.message || "(không có chữ)") + '</div>' +
      (links.length ? '<div class="blk" style="display:flex;gap:18px">' + links.join("") + '</div>' : '') +
      '<div class="acts"><button class="btn ok" onclick="approve(\'' + a.id + '\')">Duyệt</button><button class="btn no" onclick="openReject(\'' + a.id + '\')">Từ chối</button><button class="btn plain" onclick="undoReport(\'' + a.id + '\')">Không phải BC</button></div>' +
      '</div>';
  }).join("");
}

/** Bấm là bỏ thẻ ngay, xử lý chạy sau; lỗi thì báo và tải lại */
async function review(kind, id, params) {
  const list = S.cache.approvals || [];
  S.cache.approvals = list.filter(a => a.id !== id);
  if (S.cache.home) S.cache.home.stats.pending = Math.max(0, S.cache.home.stats.pending - 1);
  render();
  try {
    const res = await api(kind, Object.assign({ taskId: id }, params || {}));
    if (res.ok) { haptic("success"); toast(res.message || "Đã xong"); }
    else { haptic("error"); toast(res.message || "Không thực hiện được"); load("approvals"); load("home"); }
  } catch (e) { if (e.message !== "stop") { toast("Lỗi kết nối, đang tải lại"); load("approvals"); } }
}
function approve(id) { review("approve", id); }
function undoReport(id) { review("undo", id); }

let RJ = null;
async function openReject(id) {
  tap();
  RJ = { id: id, choice: null, options: [] };
  $("layer").innerHTML = '<div class="ov" onclick="if(event.target===this)closeLayer()"><div class="sheet"><div class="grab"></div><div class="sh">Từ chối báo cáo</div><div class="grp"><div class="cell"><div class="txt"><div class="sk" style="width:60%"></div></div></div></div></div></div>';
  try {
    const res = await api("extOptions", { taskId: id });
    if (!res.ok) { closeLayer(); toast(res.message); return; }
    RJ.options = res.options; RJ.minAt = res.minAt; RJ.suggestAt = res.suggestAt; RJ.deadline = res.deadline; RJ.title = res.title;
    drawReject();
  } catch (e) { closeLayer(); }
}
function drawReject() {
  const reason = $("rjReason") ? $("rjReason").value : "";
  const cur = RJ.choice;
  const preview = cur && cur.code ? (RJ.options.find(o => o.code === cur.code) || {}).text : (cur && cur.at ? cur.at.replace("T", " ") : "");
  $("layer").innerHTML = '<div class="ov" onclick="if(event.target===this)closeLayer()"><div class="sheet"><div class="grab"></div>' +
    '<div class="sh">Từ chối · ' + esc(RJ.title) + '</div>' +
    '<div class="hd">Lý do (gửi vào nhóm)</div><div class="grp"><input class="inp" id="rjReason" placeholder="Ví dụ: Ảnh mờ, chụp lại" value="' + esc(reason) + '"></div>' +
    '<div class="hd">Hạn mới · hạn cũ ' + esc(RJ.deadline) + '</div>' +
    '<div class="chips">' + RJ.options.map(o => '<button class="chip ' + (cur && cur.code === o.code ? 'on' : '') + '" onclick="pickRj(\'' + o.code + '\')">' + esc(o.label) + '</button>').join("") + '</div>' +
    '<div class="grp"><div class="cell"><div class="txt"><div class="t">Chọn giờ khác</div></div><input type="datetime-local" id="rjAt" min="' + esc(RJ.minAt) + '" value="' + esc(cur && cur.at ? cur.at : "") + '" onchange="pickRjAt(this.value)" style="border:none;background:none;color:var(--blue);font:inherit;font-size:15px"></div></div>' +
    (preview ? '<div class="ft">Hạn mới: <b>' + esc(preview) + '</b></div>' : '') +
    '<div class="acts" style="padding:0 16px"><button class="btn plain" onclick="closeLayer()">Đóng</button><button class="btn no" style="background:var(--red);color:#fff" onclick="submitReject()">Từ chối và gia hạn</button></div>' +
    '</div></div>';
}
function pickRj(code) { tap(); RJ.choice = { code: code }; drawReject(); }
function pickRjAt(v) { if (v) { RJ.choice = { at: v }; drawReject(); } }
function submitReject() {
  const reason = ($("rjReason").value || "").trim();
  if (!reason) { toast("Vui lòng nhập lý do"); return; }
  if (!RJ.choice) { toast("Vui lòng chọn hạn mới"); return; }
  const id = RJ.id, choice = RJ.choice;
  closeLayer();
  review("reject", id, { reason: reason, choice: choice });
}
function closeLayer() { $("layer").innerHTML = ""; }

/* ---------- Admin: Dự án ---------- */
function viewProjects(d) {
  if (!S.seg.proj) S.seg.proj = "OPEN";
  const k = S.seg.proj;
  const items = d.items.filter(i => k === "OPEN" ? i.state !== "DONE" : i.state === k);
  let h = navBar() + '<div class="lt">Dự án</div><div class="subt">' + d.counts.open + ' đang dở · ' + d.counts.overdue + ' quá hạn hoàn tất</div>' +
    seg("proj", [{ k: "OPEN", label: "Đang dở" }, { k: "OVERDUE", label: "Quá hạn" }, { k: "DONE", label: "Đã xong" }]);
  if (!items.length) return h + '<div class="empty">Không có việc nào</div>';
  return h + '<div class="grp">' + items.slice(0, 60).map(i => {
    const bars = '<div class="bars">' + i.steps.map((s, n) => '<i class="' + (s.done ? 'd' : (i.state === 'OVERDUE' && !s.done && (n === 0 || i.steps[n - 1].done) ? 'l' : (!s.done && (n === 0 || i.steps[n - 1].done) ? 'c' : ''))) + '"></i>').join("") + '</div>';
    return row({ title: i.title, sub: i.userName + (i.currentText ? " · " + i.currentText : ""), extra: '<div class="s ' + (i.state === "OVERDUE" ? "red" : "") + '">' + esc(i.deadlineInfo) + '</div>' + bars, onclick: "push({type:'project',id:'" + i.taskId + "',title:'Dự án'})" });
  }).join("") + '</div>';
}
function viewProject(p) {
  let h = navBar() + '<div class="lt md">' + esc(p.title) + '</div><div class="subt">' + esc(p.taskId) + ' · ' + esc(p.userName) + (p.groupName ? ' · ' + esc(p.groupName) : '') + '</div>';
  const kv = (k, v, tone) => v ? '<div class="blk kv"><span>' + esc(k) + '</span><span class="' + (tone || '') + '">' + esc(v) + '</span></div>' : '';
  h += '<div class="grp">' + kv("Hạn bước 1", p.step1Deadline) + kv("Bước 1", p.step1Done ? "Đã nghiệm thu " + p.step1DoneAt + (p.step1OnTime ? " (" + p.step1OnTime + ")" : "") : "Đang thực hiện") +
    kv("Hạn hoàn tất", p.projectDeadline, p.projectDeadlineOverdue ? "red" : "") + kv("Còn lại", p.projectDaysLeft != null ? p.projectDaysLeft + " ngày" : "") +
    (p.isDone ? kv("Đã hoàn tất", p.doneAt + (p.doneOnTime ? " (" + p.doneOnTime + ")" : ""), "green") : "") + '</div>';
  h += '<div class="hd">Các bước</div><div class="grp">' + p.steps.map(s =>
    '<div class="cell"><span class="dot ' + (s.done ? 'd' : (s.isCurrent ? 'c' : '')) + '">' + (s.done ? '✓' : '') + '</span><div class="txt"><div class="t">B' + s.no + ' · ' + esc(s.name) + '</div><div class="s">' + esc([s.owner, s.done && s.doneAt ? "xong " + s.doneAt : "", s.isCurrent && s.daysAtStep != null ? s.daysAtStep + " ngày ở bước này" : ""].filter(x => x).join(" · ")) + '</div></div></div>'
  ).join("") + '</div>';
  if (!p.isDone && p.step1Done) h += '<button class="btn ok wide" onclick="completeProject(\'' + p.taskId + '\')">Hoàn tất dự án</button>';
  h += '<div class="ft">Sửa tên bước, thêm hoặc xóa bước: làm trên Web hoặc Google Task.</div>';
  return h;
}
function completeProject(id) {
  const run = async ok => {
    if (!ok) return;
    try {
      const res = await api("completeProject", { taskId: id });
      if (res.ok) { haptic("success"); toast(res.message); delete S.cache.projects; back(); load("projects"); }
      else { haptic("error"); toast(res.message); }
    } catch (e) {}
  };
  try { tg.showConfirm("Hoàn tất dự án " + id + "? Google Task sẽ được tick và chuyển về list ban đầu.", run); } catch (e) { run(confirm("Hoàn tất dự án " + id + "?")); }
}

/* ---------- Admin: Nhắc nhở ---------- */
function viewCompliance(d) {
  const tone = l => l === "DISCIPLINE" ? "red" : l === "WARNING" ? "orange" : "blue";
  let h = navBar() + '<div class="lt">Nhắc nhở</div><div class="subt">30 ngày gần nhất</div>' +
    '<div class="grid three"><div class="st"><b class="blue">' + d.stats.total + '</b><span>Bản ghi</span></div><div class="st"><b class="orange">' + d.stats.warning + '</b><span>Cảnh cáo</span></div><div class="st"><b class="red">' + d.stats.discipline + '</b><span>Kỷ luật</span></div></div>';
  if (d.attention.length) h += '<div class="hd">Cần chú ý · cùng 1 lỗi từ 2 lần</div><div class="grp">' + d.attention.slice(0, 10).map(a => row({ title: a.targetName, sub: a.content, right: a.count + " lần", tone: "red" })).join("") + '</div>';
  const recs = d.records.slice(0, 60);
  h += '<div class="hd">Danh sách</div><div class="grp">' + (recs.length ? recs.map(r => {
    const cancelled = r.status === "CANCELLED";
    return row({ title: (r.targetType === "GROUP" ? "Nhóm " : "") + r.targetName, sub: r.date + " · " + r.categoryName + " · " + r.content, right: cancelled ? "Đã hủy" : r.levelLabel, tone: cancelled ? "" : tone(r.level), onclick: cancelled ? "" : "openNN('" + r.id + "')" });
  }).join("") : '<div class="cell"><div class="txt"><div class="t">Chưa có bản ghi</div></div></div>') + '</div>';
  h += '<div class="ft">Ghi nhắc nhở mới bằng lệnh /nhacnho. Thống kê để họp xem trên Web.</div>';
  return h;
}
function openNN(id) {
  tap();
  const r = (S.cache.compliance.records || []).find(x => x.id === id);
  if (!r) return;
  $("layer").innerHTML = '<div class="ov" onclick="if(event.target===this)closeLayer()"><div class="sheet"><div class="grab"></div>' +
    '<div class="sh">' + esc(r.id) + ' · ' + esc(r.levelLabel) + '</div>' +
    '<div class="grp"><div class="blk"><b>' + esc((r.targetType === "GROUP" ? "Nhóm " : "") + r.targetName) + '</b>\n' + esc(r.categoryName) + ' · lần ' + r.repeat + '\n' + esc(r.content) + '\n' + esc(r.notifiedAt ? "Đã gửi lúc " + r.notifiedAt : "Chưa gửi thông báo") + '</div></div>' +
    '<div class="hd">Hủy bản ghi · lý do</div><div class="grp"><input class="inp" id="nnReason" placeholder="Ví dụ: Ghi nhầm người"></div>' +
    '<div class="acts" style="padding:0 16px"><button class="btn plain" onclick="closeLayer()">Đóng</button><button class="btn no" style="background:var(--red);color:#fff" onclick="cancelNN(\'' + esc(r.id) + '\')">Hủy bản ghi</button></div>' +
    '</div></div>';
}
async function cancelNN(id) {
  const reason = ($("nnReason").value || "").trim();
  if (!reason) { toast("Vui lòng nhập lý do hủy"); return; }
  closeLayer();
  try {
    const res = await api("cancelCompliance", { logId: id, reason: reason });
    haptic(res.ok ? "success" : "error"); toast(res.message || (res.ok ? "Đã hủy" : "Không hủy được"));
    if (res.ok) load("compliance");
  } catch (e) {}
}

/* ---------- Khởi động ---------- */
async function start() {
  if (!tg || !tg.initData) { fatal("Mở từ Telegram", "Trang này chỉ mở được bằng nút Mini App trong Telegram."); return; }
  tg.ready(); tg.expand(); applyTheme();
  tg.onEvent("themeChanged", applyTheme);
  tg.BackButton.onClick(back);
  $("app").innerHTML = skeleton("Mini App");
  try {
    const res = await api("init");
    if (!res.ok) { fatal("Không mở được", res.message || ""); return; }
    S.me = res.me;
    S.tab = S.me.isAdmin ? "home" : "mine";
    S.cache[S.tab] = res.data;
    render();
    if (S.me.isAdmin) { load("approvals"); }
  } catch (e) { if (e.message !== "stop") fatal("Không kết nối được", "Kiểm tra mạng rồi đóng và mở lại Mini App."); }
}
start();
</script>
